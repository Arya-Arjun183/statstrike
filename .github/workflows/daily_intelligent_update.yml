name: Daily Intelligent Data Update

on:
  schedule:
    - cron: '0 8 * * *' # Run at 08:00 UTC every day
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
        
    - name: Fetch Latest Data, Retrain Model, and Precompute Cache
      env:
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: |
        # Fetch new matches. It will automatically retrain and recompute if there are new matches.
        python src/premier_league_predictor/cli.py fetch-understat --season 2026
        
        # Force recompute the cache every time, because live betting odds update daily!
        python src/premier_league_predictor/cli.py precompute-cache
        
    - name: Check for changes
      id: git-check
      run: |
        git add -A
        git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT
        
    - name: Create Pull Request
      if: steps.git-check.outputs.changes == 'true'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Automated Weekly Data, Model, & Cache Update"
        title: "Automated Data & Prediction Update"
        body: |
          This PR was auto-generated by the Daily Intelligent Update workflow.
          
          It includes:
          - The latest match results and exact Understat xG data.
          - Updated machine learning model weights.
          - A freshly rebuilt file-based JSON cache for lightning-fast website loading.
          
          Review and merge to deploy the latest predictions!
        branch: automated-data-update
        base: main
        delete-branch: true
