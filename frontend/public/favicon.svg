<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients with standard XML stop-color attributes -->
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="bar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <linearGradient id="bar5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <linearGradient id="boltGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#00F2FE" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
  </defs>

  <!-- 5 Ascending Data Telemetry Bars -->
  <rect x="12" y="60" width="10" height="26" rx="3" fill="url(#bar1)" />
  <rect x="28" y="46" width="10" height="40" rx="3" fill="url(#bar2)" />
  <rect x="44" y="32" width="10" height="54" rx="3" fill="url(#bar3)" />
  <rect x="60" y="20" width="10" height="66" rx="3" fill="url(#bar4)" />
  <rect x="76" y="10" width="10" height="76" rx="3" fill="url(#bar5)" />

  <!-- Diagonal Electric Lightning Bolt -->
  <polygon
    points="74,6 36,46 54,48 16,94 46,54 30,52"
    fill="url(#boltGradient)"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linejoin="round"
  />
</svg>